name: PR 自动化检查

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]

jobs:
  # ==================== Linux 构建 + 测试 ====================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglfw3-dev \
            libassimp-dev \
            xorg-dev

      - name: 配置 CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build --config Release -j $(nproc)

      - name: 运行测试
        working-directory: build
        run: ./Tests

  # ==================== Windows 构建 ====================
  build-windows:
    runs-on: windows-2022
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 CMake (MinGW)
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build --config Release -j 4

      - name: 运行测试
        working-directory: build
        run: ./Tests.exe

  # ==================== 代码格式检查 ====================
  format-check:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 clang-format
        run: sudo apt-get install -y clang-format

      - name: 检查代码格式
        run: |
          echo "检查 engine/ 和 app/ 目录下的 C++ 文件格式..."
          find engine app -name "*.cpp" -o -name "*.h" | head -20 | while read f; do
            diff <(cat "$f") <(clang-format "$f") || echo "格式不符: $f"
          done
          echo "格式检查完成 (仅报告，不阻断)"
